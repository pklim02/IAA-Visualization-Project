<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NC STATE IAA • Employment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Top Minimalist Masthead with Exactly 2 Action Buttons -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brick-logo">NC STATE</span>
        <div>
          <h1 class="header-title">NC STATE IAA &bull; Employment Tracker</h1>
          <div class="header-sub">Candidate Recruitment Tracker &bull; Class of 2027</div>
        </div>
      </div>

      <!-- Navigation Mode Switcher -->
      <nav class="header-nav">
        <button id="nav-overview" class="nav-tab active" data-mode="overview">
          Candidate Overview
        </button>
        <button id="nav-analytics" class="nav-tab" data-mode="analytics">
          Class Analytics
        </button>
        <button id="nav-entry" class="nav-tab" data-mode="student-entry">
          Student Entry Form
        </button>
      </nav>

      <div class="header-actions">
        <button id="btn-upload-csv" class="btn btn-primary" title="Import synthetic or live recruitment CSV">
          Import CSV
        </button>
        <input type="file" id="csv-file-input" accept=".csv" style="display: none;">

        <button id="btn-clear-data" class="btn btn-secondary" title="Reset submissions back to zero for demo">
          Reset
        </button>
      </div>
    </header>

    <!-- Master-Detail Single Screen Container -->
    <main id="app-body">
      <!-- Injected by main.js -->
    </main>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>

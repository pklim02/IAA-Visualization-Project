<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employment Tracker | NC State IAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app-body">Skip to main content</a>
  <div id="app" class="app-layout">
    <!-- Top Minimalist Masthead with Exactly 2 Action Buttons -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-lockup">
          <span class="brand-univ">NC State University</span>
          <span class="brand-unit">Institute for Advanced Analytics</span>
        </div>
        <div>
          <h1 class="header-title">Employment Tracker</h1>
          <div class="header-sub">Class of 2027</div>
        </div>
      </div>

      <!-- Navigation Mode Switcher -->
      <nav class="header-nav" aria-label="Dashboard sections">
        <button id="nav-overview" class="nav-tab active" data-mode="overview">
          Candidate Overview
        </button>
        <button id="nav-analytics" class="nav-tab" data-mode="analytics">
          Class Analytics
        </button>
        <button id="nav-entry" class="nav-tab" data-mode="student-entry">
          Student Entry Form
        </button>
        <button id="nav-database" class="nav-tab" data-mode="database-records">
          Database Records
        </button>
      </nav>

      <div class="header-actions">
        <button id="btn-upload-csv" class="btn btn-primary" title="Import a recruitment CSV">
          Import CSV
        </button>
        <input type="file" id="csv-file-input" accept=".csv" style="display: none;">

        <button id="btn-clear-data" class="btn btn-secondary" title="Reset submissions back to zero for demo">
          Reset
        </button>
      </div>
    </header>

    <!-- Master-Detail Single Screen Container -->
    <main id="app-body" tabindex="-1">
      <!-- Injected by main.js -->
    </main>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
